; =============================================================================
; supervisord.conf — NEXUS Demo Sandbox
; =============================================================================
; supervisord itself runs as PID 1 inside the container.
; The Dockerfile uses CMD ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
; so supervisord's built-in /etc/supervisor/supervisord.conf is the entry point.
; We drop our program stanzas in /etc/supervisor/conf.d/ which the default
; supervisord.conf includes via [include].
;
; RESTART POLICY RATIONALE
; ─────────────────────────
; nginx:   autorestart=true   — nginx should always be running; a crash is
;                               always unexpected and must be recovered.
;
; worker:  autorestart=unexpected, exitcodes=0
;          • SIGTERM (clean shutdown by supervisord) → exit 0 → NOT restarted.
;            This is the expected path during `supervisorctl stop worker`.
;          • OOM kill by kernel → exit 137 → IS restarted (unexpected exit).
;            The restart is clearly logged. The new process starts clean
;            (no fault active), which is correct: the old fault ESCALATED
;            to a crash. The AI should detect the OOM kill event in kernel
;            logs / dmesg, not rely on the process staying alive.
;          • Unhandled exception in worker → exit 1 → IS restarted.
;
; This means a memory fault does NOT silently self-clear while the process
; is alive. It only clears on death (OOM) or on `supervisorctl restart worker`
; which is the documented explicit reset path.
; =============================================================================

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/nginx.stdout.log
stderr_logfile=/var/log/supervisor/nginx.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:worker]
command=python3 /app/worker.py
autostart=true
autorestart=unexpected
exitcodes=0
startretries=5
stdout_logfile=/var/log/supervisor/worker.stdout.log
stderr_logfile=/var/log/supervisor/worker.stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=10MB
; stdout_events_enabled lets supervisord capture our flush=True prints
stdout_events_enabled=false
