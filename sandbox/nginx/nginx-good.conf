server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.nginx-debian.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Basic status endpoint — the AI can use this to verify nginx is alive
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
}
